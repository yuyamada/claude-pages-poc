name: Generate and Deploy to Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pages
          fetch-depth: 1

      - id: ts
        run: echo "value=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Create a single new file at
            reports/${{ steps.ts.outputs.value }}.md
            A short Markdown report body (no top-level heading — the page
            title is added separately) with a short paragraph stating it
            was generated by Claude Code running in GitHub Actions
            workflow run ${{ github.run_id }}, triggered by
            ${{ github.actor }}, at ${{ steps.ts.outputs.value }} (UTC).
            Plain Markdown only: no raw HTML tags, no script tags.

            Optionally, include one chart: a fenced code block labeled
            `chart` whose content is a single-line JSON object matching
            Chart.js's constructor config (top-level keys: type, data,
            options — e.g. {"type":"bar","data":{"labels":["A","B"],
            "datasets":[{"label":"Example","data":[1,2]}]}}). Do not
            write any JavaScript yourself; only the JSON data.

            Do not create or modify any other file.
          claude_args: |
            --allowedTools "Write"
            --max-turns 5

      - name: Install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pandoc

      - name: Write chart Lua filter
        run: |
          cat > /tmp/chart-filter.lua <<'LUA_EOF'
          local chart_count = 0
          local charts_found = false

          local function extract_charts(el)
            if el.classes:includes("chart") then
              chart_count = chart_count + 1
              charts_found = true
              local id = "chart-" .. chart_count
              local escaped = el.text:gsub("&", "&amp;"):gsub('"', "&quot;"):gsub("<", "&lt;"):gsub(">", "&gt;")
              return pandoc.RawBlock("html", '<canvas id="' .. id .. '" data-chart="' .. escaped .. '"></canvas>')
            end
          end

          local function append_script(doc)
            if charts_found then
              local script = [==[
          <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
          <script>
          document.querySelectorAll('canvas[data-chart]').forEach(function (el) {
            new Chart(el, JSON.parse(el.getAttribute('data-chart')));
          });
          </script>
          ]==]
              table.insert(doc.blocks, pandoc.RawBlock("html", script))
            end
            return doc
          end

          return {
            { CodeBlock = extract_charts },
            { Pandoc = append_script },
          }
          LUA_EOF

      - name: Render reports and index
        run: |
          mkdir -p reports _site/reports
          for f in reports/*.md; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .md)
            # -f markdown-raw_html disables pandoc's raw_html extension, so any
            # literal HTML/script tags in the source are treated as plain text
            # instead of being passed through into the rendered output. The
            # chart Lua filter is the only path that can emit a <script> tag,
            # and it only ever emits the one fixed script above — Claude
            # supplies chart JSON data, never executable code.
            pandoc -f markdown-raw_html -t html --sandbox -s \
              --lua-filter=/tmp/chart-filter.lua \
              --metadata title="Report ${name}" \
              -o "_site/reports/${name}.html" "$f"
          done
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en"><head><meta charset="UTF-8">'
            echo '<title>Claude Code Action + GitHub Pages PoC — Reports</title>'
            echo '<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:#0d1117;color:#c9d1d9;max-width:40rem;margin:3rem auto;padding:0 1.5rem;line-height:1.6}h1{color:#58a6ff;font-size:1.4rem}ul{padding-left:1.2rem}a{color:#58a6ff;text-decoration:none}a:hover{text-decoration:underline}</style>'
            echo '</head><body>'
            echo '<h1>Claude Code Action + GitHub Pages PoC — Reports</h1>'
            echo '<ul>'
            for f in $(find reports -maxdepth 1 -name '*.md' -printf '%f\n' | sort -r); do
              name="${f%.md}"
              echo "    <li><a href=\"reports/${name}.html\">${name}</a></li>"
            done
            echo '</ul></body></html>'
          } > _site/index.html

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add report ${{ steps.ts.outputs.value }}"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
