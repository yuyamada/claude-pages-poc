name: Generate and Deploy to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Create a single static HTML file at site/index.html.
            It must be a minimal, self-contained page (inline CSS only,
            no external assets) that confirms this proof-of-concept works:
            - Title: "Claude Code Action + GitHub Pages PoC"
            - A short paragraph stating this page was generated by
              Claude Code running in a GitHub Actions workflow
              (workflow run: ${{ github.run_id }}, triggered by
              ${{ github.actor }})
            - Nothing else. Do not create or modify any other file.
          claude_args: |
            --allowedTools "Write"
            --max-turns 3

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
