name: Generate and Deploy to Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: ts
        run: echo "value=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Create a single new file at
            site/reports/${{ steps.ts.outputs.value }}.html
            A minimal, self-contained HTML page (inline CSS only, no
            external assets) titled "Report ${{ steps.ts.outputs.value }}"
            with a short paragraph stating it was generated by Claude
            Code running in GitHub Actions workflow run
            ${{ github.run_id }}, triggered by ${{ github.actor }}, at
            ${{ steps.ts.outputs.value }} (UTC).
            Do not create or modify any other file.
          claude_args: |
            --allowedTools "Write"
            --max-turns 3

      - name: Rebuild index
        run: |
          mkdir -p site/reports
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en"><head><meta charset="UTF-8">'
            echo '<title>Claude Code Action + GitHub Pages PoC — Reports</title>'
            echo '<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:#0d1117;color:#c9d1d9;max-width:40rem;margin:3rem auto;padding:0 1.5rem;line-height:1.6}h1{color:#58a6ff;font-size:1.4rem}ul{padding-left:1.2rem}a{color:#58a6ff;text-decoration:none}a:hover{text-decoration:underline}</style>'
            echo '</head><body>'
            echo '<h1>Claude Code Action + GitHub Pages PoC — Reports</h1>'
            echo '<ul>'
            for f in $(find site/reports -maxdepth 1 -name '*.html' -printf '%f\n' | sort -r); do
              name="${f%.html}"
              echo "    <li><a href=\"reports/${f}\">${name}</a></li>"
            done
            echo '</ul></body></html>'
          } > site/index.html

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add report ${{ steps.ts.outputs.value }}"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
