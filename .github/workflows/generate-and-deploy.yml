name: Generate and Deploy to Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pages
          fetch-depth: 1

      - id: ts
        run: |
          echo "value=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          echo "rfc3339=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Create a single new file at
            content/${{ steps.ts.outputs.value }}.md
            with this exact front matter, followed by a Markdown body:

            ---
            title: "Report ${{ steps.ts.outputs.value }}"
            date: ${{ steps.ts.outputs.rfc3339 }}
            ---

            Body: a short paragraph stating it was generated by Claude
            Code running in GitHub Actions workflow run
            ${{ github.run_id }}, triggered by ${{ github.actor }}, at
            ${{ steps.ts.outputs.value }} (UTC). Plain Markdown only: no
            raw HTML tags, no script tags.

            Optionally, include one chart: a fenced code block labeled
            `chart` whose content is a single-line JSON object matching
            Chart.js's constructor config (top-level keys: type, data,
            options — e.g. {"type":"bar","data":{"labels":["A","B"],
            "datasets":[{"label":"Example","data":[1,2]}]}}). Do not
            write any JavaScript yourself; only the JSON data.

            Do not create or modify any other file.
          claude_args: |
            --allowedTools "Write"
            --max-turns 20

      - name: Install Hugo
        run: |
          curl -sL https://github.com/gohugoio/hugo/releases/download/v0.165.0/hugo_0.165.0_linux-amd64.deb -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb

      - name: Build site with Hugo
        run: hugo --minify --destination _site

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add report ${{ steps.ts.outputs.value }}"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
