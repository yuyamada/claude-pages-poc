name: Generate and Deploy to Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: ts
        run: echo "value=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            This repository publishes dated reports to GitHub Pages.
            Existing reports live under site/reports/ (one HTML file per
            past run, if any exist yet), and site/index.html lists them.

            1. Create a new file at
               site/reports/${{ steps.ts.outputs.value }}.html
               A minimal, self-contained HTML page (inline CSS only, no
               external assets) titled "Report ${{ steps.ts.outputs.value }}"
               with a short paragraph stating it was generated by Claude
               Code running in GitHub Actions workflow run
               ${{ github.run_id }}, triggered by ${{ github.actor }}, at
               ${{ steps.ts.outputs.value }} (UTC).

            2. List the files currently in site/reports/ (including the
               one you just created) and rewrite site/index.html as a
               minimal, self-contained HTML page titled
               "Claude Code Action + GitHub Pages PoC — Reports" that
               links to every report, newest first (the timestamp
               filenames sort correctly as plain strings).

            Do not modify or delete any existing file under
            site/reports/. Do not create or touch any file outside
            site/.
          claude_args: |
            --allowedTools "Read,Write,Glob"
            --max-turns 6

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add report ${{ steps.ts.outputs.value }}"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
